<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Movie Vocabulary — English, Russian and Kazakh film terminology glossary.">
<title>Movie Vocabulary | Film & Translation Glossary</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap');
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#697386;--line:#e6eaf0;--accent:#7c3aed;--soft:#f3eefe;--shadow:0 12px 35px rgba(28,35,52,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#fafbfe 0,#f4f6fa 100%);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.container{width:min(1120px,calc(100% - 32px));margin:auto}
header{padding:56px 0 32px}.badge{display:inline-flex;background:var(--soft);color:#6d28d9;border:1px solid #e8ddff;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:700}
h1{font-family:"Playfair Display",serif;font-size:clamp(42px,7vw,76px);line-height:1;margin:20px 0 12px;letter-spacing:-2px}
.hero p{max-width:720px;color:var(--muted);font-size:17px;line-height:1.7;margin:0}
.controls{position:sticky;top:12px;z-index:10;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow);margin:18px 0 28px;display:flex;gap:10px;align-items:center}
.search{flex:1;min-width:180px;border:0;outline:0;background:#f5f6f9;border-radius:12px;padding:13px 15px;font:inherit;color:var(--ink)}
.langs{display:flex;gap:5px}.lang{padding:10px 12px;border-radius:10px;background:transparent;color:var(--muted);font-weight:700;cursor:pointer;border:0}.lang.active{background:var(--ink);color:#fff}
.count{color:var(--muted);font-size:13px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding-bottom:60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 7px 25px rgba(25,30,45,.045);transition:.2s;animation:up .35s ease both}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.num{font-size:12px;color:#8b5cf6;font-weight:800;letter-spacing:.08em}.term{font-size:25px;font-weight:800;margin:7px 0 10px}
.trans{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.pill{font-size:12px;background:#f5f6f9;color:#566074;border:1px solid var(--line);padding:7px 9px;border-radius:8px}
.example{border-left:3px solid #a855f7;padding-left:14px;margin-top:12px}.example .en{font-size:15px;line-height:1.65;font-weight:600}.example .translation{margin-top:7px;color:var(--muted);font-size:14px;line-height:1.6}
.label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#8b5cf6;font-weight:800;margin-bottom:5px}
footer{border-top:1px solid var(--line);padding:28px 0 45px;color:var(--muted);font-size:13px;text-align:center}.empty{grid-column:1/-1;text-align:center;padding:60px;color:var(--muted)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:760px){header{padding-top:35px}.grid{grid-template-columns:1fr}.controls{flex-wrap:wrap;top:8px}.search{flex-basis:100%}.langs{flex:1}.lang{flex:1}.count{margin-left:auto}}
</style>
</head>
<body>
<main class="container">
<header class="hero">
<span class="badge">🎬 ENGLISH · РУССКИЙ · ҚАЗАҚША</span>
<h1>Movie Vocabulary</h1>
<p>University-level glossary of film and translation terminology. Explore 30 essential terms with contextual examples in English, Russian and Kazakh.</p>
</header>
<section class="controls">
<input class="search" id="search" type="search" placeholder="Search a term or translation…" aria-label="Search">
<div class="langs">
<button class="lang active" data-lang="ru">RU</button>
<button class="lang" data-lang="kz">KZ</button>
<button class="lang" data-lang="en">EN</button>
</div>
<span class="count" id="count">30 terms</span>
</section>
<section class="grid" id="grid"></section>
<footer>Movie Vocabulary · English / Russian / Kazakh · Film & Translation Glossary</footer>
</main>
<script>
const terms=[{"en": "Screenplay", "ru": "Сценарий", "kz": "Сценарий", "ex": "The screenplay combines a complex storyline with realistic dialogue.", "exru": "Сценарий сочетает сложную сюжетную линию с реалистичными диалогами.", "exkz": "Сценарий күрделі сюжеттік желіні шынайы диалогтармен үйлестіреді."}, {"en": "Cinematography", "ru": "Кинематография", "kz": "Кинематография", "ex": "The film is widely praised for its atmospheric cinematography and creative use of light.", "exru": "Фильм широко известен своей атмосферной кинематографией и творческим использованием света.", "exkz": "Фильм атмосфералық кинематографиясы мен жарықты шығармашылық тұрғыда қолдануымен жоғары бағаланады."}, {"en": "Soundtrack", "ru": "Саундтрек", "kz": "Саундтрек", "ex": "The soundtrack reinforces the emotional impact of the most important scenes.", "exru": "Саундтрек усиливает эмоциональное воздействие наиболее важных сцен.", "exkz": "Саундтрек ең маңызды көріністердің эмоционалдық әсерін күшейтеді."}, {"en": "Protagonist", "ru": "Главный герой", "kz": "Басты кейіпкер", "ex": "The protagonist gradually becomes aware of the consequences of his decisions.", "exru": "Главный герой постепенно осознаёт последствия своих решений.", "exkz": "Басты кейіпкер біртіндеп өз шешімдерінің салдарын түсіне бастайды."}, {"en": "Antagonist", "ru": "Антагонист", "kz": "Антагонист", "ex": "The antagonist challenges the protagonist throughout the film.", "exru": "Антагонист противостоит главному герою на протяжении всего фильма.", "exkz": "Антагонист фильм бойы басты кейіпкерге қарсы әрекет етеді."}, {"en": "Supporting character", "ru": "Второстепенный персонаж", "kz": "Қосалқы кейіпкер", "ex": "The supporting character provides important information that changes the protagonist’s plans.", "exru": "Второстепенный персонаж предоставляет важную информацию, которая меняет планы главного героя.", "exkz": "Қосалқы кейіпкер басты кейіпкердің жоспарларын өзгертетін маңызды ақпарат береді."}, {"en": "Character development", "ru": "Развитие персонажа", "kz": "Кейіпкердің дамуы", "ex": "The film focuses on the character development of a young man who learns from his mistakes.", "exru": "Фильм сосредоточен на развитии молодого человека, который учится на своих ошибках.", "exkz": "Фильм өз қателіктерінен сабақ алатын жас жігіттің дамуына назар аударады."}, {"en": "Plot twist", "ru": "Неожиданный поворот сюжета", "kz": "Сюжеттің күтпеген бұрылысы", "ex": "The unexpected plot twist completely changes the audience’s understanding of the story.", "exru": "Неожиданный поворот сюжета полностью меняет понимание истории зрителями.", "exkz": "Сюжеттің күтпеген бұрылысы көрермендердің оқиғаны түсінуін толығымен өзгертеді."}, {"en": "Storyline", "ru": "Сюжетная линия", "kz": "Сюжеттік желі", "ex": "The main storyline develops gradually and connects several characters’ lives.", "exru": "Основная сюжетная линия развивается постепенно и связывает жизни нескольких персонажей.", "exkz": "Негізгі сюжеттік желі біртіндеп дамып, бірнеше кейіпкердің өмірін байланыстырады."}, {"en": "Flashback", "ru": "Флешбэк / воспоминание", "kz": "Өткенді еске түсіру", "ex": "A flashback reveals an important event from the protagonist’s childhood.", "exru": "Флешбэк раскрывает важное событие из детства главного героя.", "exkz": "Өткенді еске түсіру басты кейіпкердің балалық шағындағы маңызды оқиғаны ашады."}, {"en": "Foreshadowing", "ru": "Предвосхищение событий", "kz": "Алдағы оқиғаны алдын ала көрсету", "ex": "The director uses foreshadowing to subtly prepare the audience for the final revelation.", "exru": "Режиссёр использует предвосхищение событий, чтобы ненавязчиво подготовить зрителей к финальному раскрытию.", "exkz": "Режиссер көрермендерді финалдағы маңызды ашылуға біртіндеп дайындау үшін алдағы оқиғаны алдын ала көрсетуді қолданады."}, {"en": "Narrator", "ru": "Рассказчик", "kz": "Баяндаушы", "ex": "The narrator describes the events from a personal and subjective perspective.", "exru": "Рассказчик описывает события с личной и субъективной точки зрения.", "exkz": "Баяндаушы оқиғаларды жеке және субъективті көзқарас тұрғысынан сипаттайды."}, {"en": "Dialogue", "ru": "Диалог", "kz": "Диалог", "ex": "The natural dialogue makes the interactions between the characters more convincing.", "exru": "Естественный диалог делает взаимодействие между персонажами более убедительным.", "exkz": "Табиғи диалог кейіпкерлер арасындағы қарым-қатынасты нанымдырақ етеді."}, {"en": "Monologue", "ru": "Монолог", "kz": "Монолог", "ex": "The protagonist delivers a powerful monologue about his fears and ambitions.", "exru": "Главный герой произносит сильный монолог о своих страхах и амбициях.", "exkz": "Басты кейіпкер өзінің қорқыныштары мен мақсаттары туралы әсерлі монолог айтады."}, {"en": "Scene", "ru": "Сцена / эпизод", "kz": "Көрініс / эпизод", "ex": "The final scene provides an emotional conclusion to the protagonist’s journey.", "exru": "Финальная сцена даёт эмоциональное завершение истории главного героя.", "exkz": "Соңғы көрініс басты кейіпкердің оқиғасына эмоционалды қорытынды жасайды."}, {"en": "Mise-en-scène", "ru": "Постановка кадра", "kz": "Кадрды қою", "ex": "The carefully designed mise-en-scène helps establish the film’s dark and mysterious atmosphere.", "exru": "Тщательно продуманная постановка кадра помогает создать мрачную и таинственную атмосферу фильма.", "exkz": "Мұқият ойластырылған кадр қою фильмнің күңгірт әрі құпия атмосферасын қалыптастыруға көмектеседі."}, {"en": "Close-up", "ru": "Крупный план", "kz": "Жақын план", "ex": "The director uses a close-up to emphasize the character’s emotional reaction.", "exru": "Режиссёр использует крупный план, чтобы подчеркнуть эмоциональную реакцию персонажа.", "exkz": "Режиссер кейіпкердің эмоционалдық реакциясын көрсету үшін жақын планды қолданады."}, {"en": "Voice-over", "ru": "Закадровый голос", "kz": "Кадр сыртындағы дауыс", "ex": "The voice-over provides additional information about the protagonist’s past.", "exru": "Закадровый голос предоставляет дополнительную информацию о прошлом главного героя.", "exkz": "Кадр сыртындағы дауыс басты кейіпкердің өткені туралы қосымша ақпарат береді."}, {"en": "Special effects", "ru": "Спецэффекты", "kz": "Арнайы әсерлер", "ex": "The film uses practical special effects to create realistic action sequences.", "exru": "В фильме используются практические спецэффекты для создания реалистичных экшен-сцен.", "exkz": "Фильмде шынайы экшн көріністерін жасау үшін практикалық арнайы әсерлер қолданылады."}, {"en": "Visual effects", "ru": "Визуальные эффекты", "kz": "Көрнекі әсерлер", "ex": "The visual effects allow the filmmakers to create environments that could not exist in reality.", "exru": "Визуальные эффекты позволяют создателям фильма создавать пространства, которые не могли бы существовать в реальности.", "exkz": "Көрнекі әсерлер фильм жасаушыларға шынайы өмірде болуы мүмкін емес орталарды жасауға мүмкіндік береді."}, {"en": "Box office", "ru": "Кассовые сборы", "kz": "Кассалық түсім", "ex": "The film achieved impressive box-office results during its opening weekend.", "exru": "Фильм показал впечатляющие кассовые результаты в первые выходные после премьеры.", "exkz": "Фильм премьерадан кейінгі алғашқы демалыс күндерінде жоғары кассалық түсім көрсетті."}, {"en": "Blockbuster", "ru": "Кассовый хит", "kz": "Кассалық хит", "ex": "The science-fiction film became a global blockbuster shortly after its release.", "exru": "Научно-фантастический фильм вскоре после выхода стал мировым кассовым хитом.", "exkz": "Ғылыми-фантастикалық фильм шыққаннан кейін көп ұзамай әлемдік кассалық хитке айналды."}, {"en": "Premiere", "ru": "Премьера", "kz": "Премьера", "ex": "The film’s international premiere attracted journalists and industry professionals from around the world.", "exru": "Международная премьера фильма привлекла журналистов и профессионалов киноиндустрии со всего мира.", "exkz": "Фильмнің халықаралық премьерасына әлемнің түкпір-түкпірінен журналистер мен киноиндустрия мамандары қатысты."}, {"en": "Film adaptation", "ru": "Экранизация", "kz": "Экранизация", "ex": "The film adaptation remains faithful to the central themes of the original novel.", "exru": "Экранизация сохраняет основные темы оригинального романа.", "exkz": "Экранизация түпнұсқа романның негізгі тақырыптарына адал болып қалады."}, {"en": "Sequel", "ru": "Продолжение фильма", "kz": "Фильмнің жалғасы", "ex": "The sequel expands the original story by introducing new characters and conflicts.", "exru": "Продолжение расширяет оригинальную историю, вводя новых персонажей и конфликты.", "exkz": "Фильмнің жалғасы жаңа кейіпкерлер мен қақтығыстарды енгізу арқылы бастапқы оқиғаны кеңейтеді."}, {"en": "Prequel", "ru": "Предыстория", "kz": "Алдыңғы оқиғаны баяндайтын фильм", "ex": "The prequel explores the events that led to the conflict in the original film.", "exru": "Предыстория рассказывает о событиях, которые привели к конфликту в оригинальном фильме.", "exkz": "Алдыңғы оқиғаны баяндайтын фильм түпнұсқа фильмдегі қақтығысқа әкелген оқиғаларды зерттейді."}, {"en": "Remake", "ru": "Ремейк", "kz": "Ремейк", "ex": "The remake introduces modern visual techniques while preserving the original story.", "exru": "Ремейк использует современные визуальные технологии, сохраняя при этом оригинальную историю.", "exkz": "Ремейк бастапқы оқиғаны сақтай отырып, заманауи визуалды технологияларды қолданады."}, {"en": "Spin-off", "ru": "Ответвление от основного сюжета", "kz": "Негізгі сюжеттің тармағы", "ex": "The spin-off focuses on a supporting character whose story was not fully explored in the original film.", "exru": "Спин-офф сосредоточен на второстепенном персонаже, чья история не была полностью раскрыта в оригинальном фильме.", "exkz": "Спин-офф бастапқы фильмде оқиғасы толық ашылмаған қосалқы кейіпкерге назар аударады."}, {"en": "Film critic", "ru": "Кинокритик", "kz": "Кино сыншысы", "ex": "The film critic analyzed the director’s use of symbolism and narrative structure.", "exru": "Кинокритик проанализировал использование режиссёром символики и структуры повествования.", "exkz": "Кино сыншысы режиссердің символика мен баяндау құрылымын қолдануын талдады."}, {"en": "Award-winning", "ru": "Отмеченный наградами", "kz": "Жүлдеге ие болған", "ex": "The award-winning director is known for creating films with complex themes and memorable characters.", "exru": "Отмеченный наградами режиссёр известен созданием фильмов со сложными темами и запоминающимися персонажами.", "exkz": "Жүлдеге ие болған режиссер күрделі тақырыптары мен есте қаларлық кейіпкерлері бар фильмдер жасаумен танымал."}];
let lang="ru";
const grid=document.getElementById("grid"), search=document.getElementById("search"), count=document.getElementById("count");
function render(){
 const q=search.value.toLowerCase().trim();
 const filtered=terms.filter(t=>(t.en+" "+t.ru+" "+t.kz+" "+t.ex+" "+t.exru+" "+t.exkz).toLowerCase().includes(q));
 count.textContent=filtered.length+" "+(filtered.length===1?"term":"terms");
 grid.innerHTML=filtered.length?filtered.map(t=>{
   const main=lang==="en"?t.en:lang==="kz"?t.kz:t.ru;
   const secondary=lang==="en"?t.ru+" · "+t.kz:lang==="kz"?t.en+" · "+t.ru:t.en+" · "+t.kz;
   const example=lang==="en"?t.ex:lang==="kz"?t.exkz:t.exru;
   return `<article class="card">
      <div class="num">${String(terms.indexOf(t)+1).padStart(2,"0")}</div>
      <div class="term">${main}</div>
      <div class="trans"><span class="pill">${secondary}</span></div>
      <div class="example"><div class="label">Contextual example</div><div class="en">${t.ex}</div><div class="translation">${example}</div></div>
   </article>`
 }).join(""):`<div class="empty">No terms found. Try another search.</div>`;
}
document.querySelectorAll(".lang").forEach(btn=>btn.addEventListener("click",()=>{
 document.querySelectorAll(".lang").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");lang=btn.dataset.lang;render();
}));
search.addEventListener("input",render);render();
</script>
</body>
</html>
